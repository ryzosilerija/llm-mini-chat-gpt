[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minigpt"
version = "0.1.0"
description = "Small ChatGPT-style model (pretrain -> SFT -> API) for game NPCs"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["minigpt", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
